<!DOCTYPE html>
<html>
	<head>
	    <title>QuadClick Settings</title>
	    <link rel="stylesheet" href="popup.css">
	</head>
	<body>
		<h2>Settings</h2>
		<h3>Line settings</h3>

		<label for="line_thickness" id="label_line_thickness">Thickness (1)</label>
		<input type="range" id="line_thickness" min="1" max="20" value="1">

		<div class="aligned_input">
			<label for="line_colour_picker">Colour:</label>
			<input type="color" id="line_colour_picker" value="#ff0000">
		</div>

		<h3>Keybindings</h3>
		<small>Ctrl (!) and Alt (+) must be in this order, so for alt+ctrl+c it still would be !+c</small>

		<div id="keybindings">
		</div>

		<div id="toast">
		</div>

		<script src="popup.js"></script>
	</body>
</html>
